services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ${COMPOSE_PROJECT_NAME:-doc_knowledge_example}_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-example_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example_password}
      POSTGRES_DB: ${POSTGRES_DB:-doc_knowledge_example_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-example_user} -d ${POSTGRES_DB:-doc_knowledge_example_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network

  floci:
    image: floci/floci:latest
    container_name: ${COMPOSE_PROJECT_NAME:-doc_knowledge_example}_floci
    volumes:
      - floci_data:/app/data
    ports:
      - "${FLOCI_PORT:-4566}:4566"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=${AWS_REGION:-us-east-1}
    restart: unless-stopped
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: ${COMPOSE_PROJECT_NAME:-doc_knowledge_example}_backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
      - "5005:5005"
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: ${POSTGRES_HOST:-postgres}
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-doc_knowledge_example_db}
      DB_USERNAME: ${POSTGRES_USER:-example_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-example_password}
      JWT_SECRET: ${JWT_SECRET:-example_secret_key_change_me_to_at_least_64_characters_long_12345}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:8000}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-http://floci:4566}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-example-bucket}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-example_access_key}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-example_secret_key}
      AWS_S3_PATH_STYLE_ACCESS: ${AWS_S3_PATH_STYLE_ACCESS:-true}
      SPRING_THREADS_VIRTUAL_ENABLED: ${SPRING_THREADS_VIRTUAL_ENABLED:-false}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      LIQUIBASE_ENABLED: ${LIQUIBASE_ENABLED:-true}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-true}
    volumes:
      - ./backend/src:/app/src
      - backend_gradle_cache:/root/.gradle
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
        - action: rebuild
          path: ./backend/build.gradle
        - action: rebuild
          path: ./backend/settings.gradle
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
      target: dev
    container_name: ${COMPOSE_PROJECT_NAME:-doc_knowledge_example}_ai
    ports:
      - "${AI_PORT:-8000}:8000"
    environment:
      AI_HTTP_PORT: 8000
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-doc_knowledge_example_db}
      POSTGRES_USER: ${POSTGRES_USER:-example_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example_password}
      LLM_API_KEY: ${LLM_API_KEY:-your-openai-api-key-here}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    volumes:
      - ./ai/src:/app/src
    develop:
      watch:
        - action: sync
          path: ./ai/src
          target: /app/src
        - action: rebuild
          path: ./ai/pyproject.toml
        - action: rebuild
          path: ./ai/uv.lock
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: ${COMPOSE_PROJECT_NAME:-doc_knowledge_example}_frontend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      NODE_ENV: development
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
      VITE_APP_ENV: development
      VITE_ENABLE_DEBUG: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/public
          target: /app/public
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME:-doc_knowledge_example}_network
    driver: bridge

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-doc_knowledge_example}_postgres_data
    driver: local
  backend_gradle_cache:
    name: ${COMPOSE_PROJECT_NAME:-doc_knowledge_example}_gradle_cache
    driver: local
  floci_data:
    name: ${COMPOSE_PROJECT_NAME:-doc_knowledge_example}_floci_data
    driver: local
