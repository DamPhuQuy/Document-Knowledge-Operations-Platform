services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ${COMPOSE_PROJECT_NAME:-doc_knowledge_staging}_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doc_knowledge_staging_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-doc_knowledge_staging}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doc_knowledge_staging_user} -d ${POSTGRES_DB:-doc_knowledge_staging}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: prod
    container_name: ${COMPOSE_PROJECT_NAME:-doc_knowledge_staging}_backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_PROFILES_ACTIVE: staging
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-doc_knowledge_staging}
      DB_USERNAME: ${POSTGRES_USER:-doc_knowledge_staging_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-14400000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://staging.docknowledge.company.com,http://localhost:3000}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:8000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - app_network

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
      target: prod
    container_name: ${COMPOSE_PROJECT_NAME:-doc_knowledge_staging}_ai
    ports:
      - "${AI_PORT:-8000}:8000"
    environment:
      AI_HTTP_PORT: 8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-doc_knowledge_staging}
      POSTGRES_USER: ${POSTGRES_USER:-doc_knowledge_staging_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
        VITE_APP_TITLE: ${VITE_APP_TITLE:-Document & Knowledge Operations Platform (Staging)}
        VITE_APP_ENV: staging
        VITE_ENABLE_DEBUG: "true"
        VITE_APP_VERSION: ${APP_VERSION:-1.0.0-staging}
    container_name: ${COMPOSE_PROJECT_NAME:-doc_knowledge_staging}_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - app_network

networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME:-doc_knowledge_staging}_network
    driver: bridge

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-doc_knowledge_staging}_postgres_data
    driver: local
