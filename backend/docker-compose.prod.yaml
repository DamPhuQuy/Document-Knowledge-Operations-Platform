services:
  postgres:
    image: postgres:16-alpine
    container_name: doc_knowledge_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doc_app_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your-secure-production-db-password}
      POSTGRES_DB: ${POSTGRES_DB:-doc_knowledge_prod}
    volumes:
      - doc_knowledge_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doc_app_prod} -d ${POSTGRES_DB:-doc_knowledge_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: doc_knowledge_backend_prod
    restart: always
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - path: .env.prod
        required: false
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  doc_knowledge_postgres_prod_data:
    driver: local
