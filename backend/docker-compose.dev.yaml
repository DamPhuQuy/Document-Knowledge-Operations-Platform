services:
  postgres:
    image: postgres:16-alpine
    container_name: doc_knowledge_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doc_app_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your-dev-db-password}
      POSTGRES_DB: ${POSTGRES_DB:-doc_knowledge_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - doc_knowledge_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doc_app_dev} -d ${POSTGRES_DB:-doc_knowledge_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: doc_knowledge_backend_dev
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
      - "5005:5005" # JDWP Remote Debugging port
    env_file:
      - path: .env.dev
        required: false
      - path: .env
        required: false
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      # Mount source directory for live development
      - ./src:/app/src
      # Persist Gradle cache between restarts
      - doc_knowledge_gradle_dev_cache:/root/.gradle
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  doc_knowledge_postgres_dev_data:
    driver: local
  doc_knowledge_gradle_dev_cache:
    driver: local
