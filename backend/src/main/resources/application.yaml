server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: doc-knowledge-platform
  config:
    import: optional:file:.env[.properties]

  # Database DataSource Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:doc_knowledge_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      pool-name: DocKnowledgeHikariPool

  # JPA & Hibernate Configuration
  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:true}
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      "[hibernate.format_sql]": ${JPA_FORMAT_SQL:true}
      "[hibernate.jdbc.time_zone]": UTC

  # Liquibase Database Migrations
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    drop-first: ${LIQUIBASE_DROP_FIRST:false}

  # Jackson JSON Serialization
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

# Application Custom Properties
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
  swagger:
    enabled: ${SWAGGER_ENABLED:true}
    title: ${SWAGGER_TITLE:Document and Knowledge Operations Platform API}
    description: ${SWAGGER_DESCRIPTION:RESTful API documentation for Document and Knowledge Operations Platform}
    version: ${SWAGGER_VERSION:1.0.0}
  ai:
    llm:
      url: ${AI_SERVICE_URL:http://localhost:8000}
      generate-path: ${AI_GENERATE_PATH:/api/v1/ai/generate}
      timeout: ${LLM_TIMEOUT:10s}

# SpringDoc OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${app.swagger.enabled}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${app.swagger.enabled}
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    "[com.platform.app]": DEBUG
    "[org.springframework.web]": INFO
    "[org.hibernate.SQL]": ${JPA_SHOW_SQL:INFO}
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr([%X{traceId:-}]){yellow} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
