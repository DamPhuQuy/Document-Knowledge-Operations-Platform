server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: doc-knowledge-platform
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:false}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  # Database DataSource Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:${POSTGRES_HOST:localhost}}:${DB_PORT:${POSTGRES_PORT:5432}}/${DB_NAME:${POSTGRES_DB:doc_knowledge_example_db}}
    username: ${DB_USERNAME:${POSTGRES_USER:example_user}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:example_password}}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
      pool-name: DocKnowledgeHikariPool

  # JPA & Hibernate Configuration
  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      "[hibernate.format_sql]": ${JPA_FORMAT_SQL:false}
      "[hibernate.jdbc.time_zone]": UTC

  # Liquibase Database Migrations
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    drop-first: ${LIQUIBASE_DROP_FIRST:false}

  # Jackson JSON Serialization
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

  # Servlet Multipart Configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: ${SPRING_MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${SPRING_MULTIPART_MAX_REQUEST_SIZE:55MB}

# AWS S3 / Floci Object Storage Configuration
aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:http://localhost:4566}
    region: ${AWS_REGION:us-east-1}
    bucket-name: ${AWS_S3_BUCKET:example-bucket}
    access-key-id: ${AWS_ACCESS_KEY_ID:example_access_key}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:example_secret_key}
    path-style-access: ${AWS_S3_PATH_STYLE_ACCESS:true}

# Application Custom Properties
app:
  jwt:
    secret: ${JWT_SECRET:example_secret_key_change_me_to_at_least_64_characters_long_12345}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  swagger:
    enabled: ${SWAGGER_ENABLED:true}
    title: ${SWAGGER_TITLE:Document and Knowledge Operations Platform API}
    description: ${SWAGGER_DESCRIPTION:RESTful API documentation for Document and Knowledge Operations Platform}
    version: ${SWAGGER_VERSION:1.0.0}

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${app.swagger.enabled}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${app.swagger.enabled}
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    "[com.platform.app]": DEBUG
    "[org.springframework.web]": INFO
    "[org.hibernate.SQL]": ${HIBERNATE_SQL_LOG_LEVEL:DEBUG}
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr([%X{traceId:-}]){yellow} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
