server:
  port: ${SERVER_PORT:8080}

spring:
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}
  datasource:
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:25}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      "[hibernate.format_sql]": false
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    drop-first: false
  # Mail / SMTP Configuration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:}
    region: ${AWS_REGION:us-east-1}
    bucket-name: ${AWS_S3_BUCKET:doc-knowledge-storage-staging}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    path-style-access: ${AWS_S3_PATH_STYLE_ACCESS:false}

app:
  jwt:
    expiration-ms: ${JWT_EXPIRATION_MS:14400000} # 4 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://staging.docknowledge.company.com,http://localhost:3000,http://localhost:5173}
  swagger:
    enabled: ${SWAGGER_ENABLED:true} # Accessible in staging for QA validation
  ai:
    llm:
      url: ${AI_SERVICE_URL:http://ai-service-staging:8000}
      generate-path: ${AI_GENERATE_PATH:/api/v1/ai/generate}
      timeout: ${LLM_TIMEOUT:20s}

logging:
  level:
    root: INFO
    "[com.platform.app]": INFO
    "[org.springframework.web]": INFO
    "[org.hibernate.SQL]": WARN
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr([%X{traceId:-}]){yellow} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
