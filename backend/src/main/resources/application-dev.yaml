server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
  jpa:
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: ${JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      "[hibernate.format_sql]": ${JPA_FORMAT_SQL:false}
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    drop-first: false

app:
  jwt:
    expiration-ms: ${JWT_EXPIRATION_MS:43200000} # 12 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://dev.support.company.com,http://localhost:3000,http://localhost:5173}
  swagger:
    enabled: ${SWAGGER_ENABLED:true}
  ai:
    llm:
      url: ${AI_SERVICE_URL:http://ai-service-dev:8000}
      generate-path: ${AI_GENERATE_PATH:/api/v1/ai/generate}
      timeout: ${LLM_TIMEOUT:15s}

logging:
  level:
    root: INFO
    "[com.platform.app]": INFO
    "[org.hibernate.SQL]": WARN
