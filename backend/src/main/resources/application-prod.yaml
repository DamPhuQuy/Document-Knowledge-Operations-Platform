server:
  port: ${SERVER_PORT:8080}

spring:
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}
  datasource:
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:50}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      "[hibernate.format_sql]": false
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    drop-first: false
    # Mail / SMTP Configuration
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

aws:
  s3:
    endpoint: ${AWS_S3_ENDPOINT:}
    region: ${AWS_REGION:us-east-1}
    bucket-name: ${AWS_S3_BUCKET:doc-knowledge-storage-prod}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    path-style-access: ${AWS_S3_PATH_STYLE_ACCESS:false}

app:
  jwt:
    expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 hour
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://docknowledge.company.com}
  swagger:
    enabled: ${SWAGGER_ENABLED:false} # Disabled in production for security
  ai:
    llm:
      url: ${AI_SERVICE_URL:http://ai-service:8000}
      generate-path: ${AI_GENERATE_PATH:/api/v1/ai/generate}
      timeout: ${LLM_TIMEOUT:30s}

logging:
  level:
    root: WARN
    "[com.platform.app]": INFO
    "[org.springframework.web]": WARN
    "[org.hibernate.SQL]": ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p ${PID:- } --- [%15.15t] [%X{traceId:-}] %-40.40logger{39} : %m%n%wEx"
