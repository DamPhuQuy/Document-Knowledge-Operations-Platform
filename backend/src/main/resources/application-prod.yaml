server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:50}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      "[hibernate.format_sql]": false
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    drop-first: false

app:
  jwt:
    expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 hour
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://docknowledge.company.com}
  swagger:
    enabled: ${SWAGGER_ENABLED:false} # Disabled in production for security
  ai:
    llm:
      url: ${AI_SERVICE_URL:http://ai-service:8000}
      generate-path: ${AI_GENERATE_PATH:/api/v1/ai/generate}
      timeout: ${LLM_TIMEOUT:30s}

logging:
  level:
    root: WARN
    "[com.platform.app]": INFO
    "[org.springframework.web]": WARN
    "[org.hibernate.SQL]": ERROR
