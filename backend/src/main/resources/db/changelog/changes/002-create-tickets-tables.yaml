databaseChangeLog:
  - changeSet:
      id: 002-create-tickets-tables
      author: platform
      changes:
        - createTable:
            tableName: tickets
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: customer_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_tickets_customer
                    references: users(id)
              - column:
                  name: customer_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: assigned_agent_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_tickets_assigned_agent
                    references: users(id)
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: "OPEN"
                  constraints:
                    nullable: false
              - column:
                  name: priority
                  type: VARCHAR(50)
                  defaultValue: "MEDIUM"
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: VARCHAR(50)
                  defaultValue: "GENERAL_INQUIRY"
                  constraints:
                    nullable: false
              - column:
                  name: resolution_notes
                  type: TEXT
              - column:
                  name: resolved_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: closed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_tickets_customer_id
            tableName: tickets
            columns:
              - column:
                  name: customer_id
        - createIndex:
            indexName: idx_tickets_assigned_agent_id
            tableName: tickets
            columns:
              - column:
                  name: assigned_agent_id
        - createIndex:
            indexName: idx_tickets_status
            tableName: tickets
            columns:
              - column:
                  name: status
        - createTable:
            tableName: ticket_messages
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: ticket_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ticket_messages_ticket
                    references: tickets(id)
                    deleteCascade: true
              - column:
                  name: sender_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: sender_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: sender_role
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: is_internal_note
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_ticket_messages_ticket_id
            tableName: ticket_messages
            columns:
              - column:
                  name: ticket_id
