databaseChangeLog:
  - changeSet:
      id: 007-create-action-approvals-table
      author: platform
      changes:
        - createTable:
            tableName: action_approvals
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_action_approvals
              - column:
                  name: execution_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_action_approvals_execution
                    references: workflow_executions(id)
                    onDelete: SET NULL
              - column:
                  name: action_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: idempotency_key
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_action_approvals_idempotency
              - column:
                  name: preview_payload
                  type: JSONB
                  defaultValueComputed: "'{}'::jsonb"
                  constraints:
                    nullable: false
              - column:
                  name: execution_result
                  type: JSONB
                  defaultValueComputed: "'{}'::jsonb"
                  constraints:
                    nullable: false
              - column:
                  name: requested_by_user_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_action_approvals_requested_by
                    references: users(id)
                    onDelete: SET NULL
              - column:
                  name: reviewed_by_user_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_action_approvals_reviewed_by
                    references: users(id)
                    onDelete: SET NULL
              - column:
                  name: review_notes
                  type: TEXT
              - column:
                  name: requested_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: reviewed_at
                  type: TIMESTAMPTZ
              - column:
                  name: committed_at
                  type: TIMESTAMPTZ
        - createIndex:
            indexName: idx_action_approvals_status
            tableName: action_approvals
            columns:
              - column:
                  name: status
        - createIndex:
            indexName: idx_action_approvals_idempotency_key
            tableName: action_approvals
            columns:
              - column:
                  name: idempotency_key
        - createIndex:
            indexName: idx_action_approvals_status_requested
            tableName: action_approvals
            columns:
              - column:
                  name: status
              - column:
                  name: requested_at

  - changeSet:
      id: 007-create-operation-tasks-table
      author: platform
      changes:
        - createTable:
            tableName: operation_tasks
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_operation_tasks
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: priority
                  type: VARCHAR(50)
                  defaultValue: MEDIUM
                  constraints:
                    nullable: false
              - column:
                  name: creator_id
                  type: UUID
                  constraints:
                    nullable: false
                    foreignKeyName: fk_op_tasks_creator
                    references: users(id)
                    onDelete: RESTRICT
              - column:
                  name: assignee_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_op_tasks_assignee
                    references: users(id)
                    onDelete: SET NULL
              - column:
                  name: document_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_op_tasks_document
                    references: documents(id)
                    onDelete: SET NULL
              - column:
                  name: execution_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_op_tasks_execution
                    references: workflow_executions(id)
                    onDelete: SET NULL
              - column:
                  name: metadata
                  type: JSONB
                  defaultValueComputed: "'{}'::jsonb"
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_op_tasks_status
            tableName: operation_tasks
            columns:
              - column:
                  name: status
        - createIndex:
            indexName: idx_op_tasks_creator_id
            tableName: operation_tasks
            columns:
              - column:
                  name: creator_id
        - createIndex:
            indexName: idx_op_tasks_assignee_id
            tableName: operation_tasks
            columns:
              - column:
                  name: assignee_id
        - createIndex:
            indexName: idx_op_tasks_status_priority
            tableName: operation_tasks
            columns:
              - column:
                  name: status
              - column:
                  name: priority
