databaseChangeLog:
  - changeSet:
      id: 005-create-conversations-table
      author: platform
      changes:
        - createTable:
            tableName: conversations
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_conversations
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_conversations_user
                    references: users(id)
                    onDelete: CASCADE
              - column:
                  name: title
                  type: VARCHAR(255)
                  defaultValue: New Conversation
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_conversations_user_updated
            tableName: conversations
            columns:
              - column:
                  name: user_id
              - column:
                  name: updated_at

  - changeSet:
      id: 005-create-conversation-messages-table
      author: platform
      changes:
        - createTable:
            tableName: conversation_messages
            columns:
              - column:
                  name: id
                  type: VARCHAR(64)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_conversation_messages
              - column:
                  name: conversation_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_conv_messages_conversation
                    references: conversations(id)
                    onDelete: CASCADE
              - column:
                  name: role
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: confidence
                  type: VARCHAR(50)
              - column:
                  name: prompt_tokens
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: completion_tokens
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_conv_messages_conv_created
            tableName: conversation_messages
            columns:
              - column:
                  name: conversation_id
              - column:
                  name: created_at

  - changeSet:
      id: 005-create-message-citations-table
      author: platform
      changes:
        - createTable:
            tableName: message_citations
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_message_citations
              - column:
                  name: message_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_citations_message
                    references: conversation_messages(id)
                    onDelete: CASCADE
              - column:
                  name: document_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_citations_document
                    references: documents(id)
                    onDelete: CASCADE
              - column:
                  name: chunk_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_citations_chunk
                    references: document_chunks(id)
                    onDelete: CASCADE
              - column:
                  name: relevance_score
                  type: FLOAT
                  defaultValueNumeric: 0.0
                  constraints:
                    nullable: false
              - column:
                  name: snippet
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_citations_message_id
            tableName: message_citations
            columns:
              - column:
                  name: message_id
        - createIndex:
            indexName: idx_citations_document_id
            tableName: message_citations
            columns:
              - column:
                  name: document_id
        - createIndex:
            indexName: idx_citations_chunk_id
            tableName: message_citations
            columns:
              - column:
                  name: chunk_id
