databaseChangeLog:
  - changeSet:
      id: 004-create-audit-logs-table
      author: platform
      changes:
        - createTable:
            tableName: audit_logs
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_audit_logs
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    foreignKeyName: fk_audit_logs_user
                    references: users(id)
                    onDelete: SET NULL
              - column:
                  name: action
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: resource_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: resource_id
                  type: VARCHAR(64)
              - column:
                  name: ip_address
                  type: VARCHAR(45)
              - column:
                  name: user_agent
                  type: TEXT
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: SUCCESS
                  constraints:
                    nullable: false
              - column:
                  name: details
                  type: JSONB
                  defaultValueComputed: "'{}'::jsonb"
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_audit_logs_user_id
            tableName: audit_logs
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_audit_logs_resource
            tableName: audit_logs
            columns:
              - column:
                  name: resource_type
              - column:
                  name: resource_id
        - createIndex:
            indexName: idx_audit_logs_created_at
            tableName: audit_logs
            columns:
              - column:
                  name: created_at
        - createIndex:
            indexName: idx_audit_logs_user_created
            tableName: audit_logs
            columns:
              - column:
                  name: user_id
              - column:
                  name: created_at
