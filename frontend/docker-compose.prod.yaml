services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.docknowledge.company.com/api/v1}
        VITE_APP_TITLE: ${VITE_APP_TITLE:-Document & Knowledge Operations Platform}
        VITE_APP_ENV: production
        VITE_ENABLE_DEBUG: "false"
    container_name: doc_knowledge_frontend_prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    env_file:
      - path: .env.production
        required: false
      - path: .env.prod
        required: false
      - path: .env
        required: false
