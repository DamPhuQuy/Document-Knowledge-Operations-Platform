services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: doc_knowledge_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev -- --host 0.0.0.0 --port 5173
